name: Deploy ZeroFilter to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'engine/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["ZeroFilter Hourly Release Pipeline"]
    types: [completed]
  schedule:
    # Daily automated refresh at 04:00 UTC (100% free)
    - cron: '0 4 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The editorial gate: nothing future-dated, nothing unsourced, no quote
      # without a link to where it was said. A refused episode fails the deploy.
      - name: Test suite + editorial gate
        run: node engine/unit.mjs

      - name: Build dist/ (published episodes only)
        run: node engine/build_site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
