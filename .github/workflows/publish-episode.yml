name: ZeroFilter Hourly Release Pipeline

on:
  # FROZEN 2026-10-14 by the owner (out of credits) — restore on "resume".
  # schedule:
  #   - cron: '0 * * * *' # Every hour on the hour
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release generation'
        required: false
        default: 'true'

concurrency:
  group: zerofilter-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Suite
        run: |
          node engine/unit.mjs
          node engine/video-cover.mjs --selftest
          node engine/pipeline.mjs --dry-run
