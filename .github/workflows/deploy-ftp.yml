name: Deploy ZeroFilter to photon-bounce.com

# https://photon-bounce.com/zerofilter/ is uploaded by the PhotonBounce/photonbounce
# repo (workflow deploy-zerofilter.yml), because that repo holds the FTP
# credentials and GitHub never shares secrets between repos. This workflow runs
# the editorial gate and the build here first, then asks photonbounce to deploy
# this exact commit.
#
# One secret, set in THIS repo: PHOTONBOUNCE_DEPLOY_TOKEN, a fine-grained
# personal access token with access to PhotonBounce/photonbounce only and
# Actions: Read and write. It can start a workflow there; it cannot read
# secrets or change code.

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'engine/**'
      - '.github/workflows/deploy-ftp.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (photonbounce logs what would change, uploads nothing)"
        type: boolean
        default: false

concurrency:
  group: ftp-deploy-zerofilter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fail here, with the reason, rather than in the other repo.
      - name: Test suite + editorial gate
        run: node engine/unit.mjs

      - name: Build dist/ (published episodes only)
        run: node engine/build_site.mjs

      - name: Ask photonbounce to deploy this commit
        env:
          TOKEN: ${{ secrets.PHOTONBOUNCE_DEPLOY_TOKEN }}
          DRY: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::PHOTONBOUNCE_DEPLOY_TOKEN is not set in this repo's Actions secrets."
            exit 1
          fi
          api() { curl -sS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          # workflow_dispatch only reaches workflows on the default branch.
          branch=$(api https://api.github.com/repos/PhotonBounce/photonbounce | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.default_branch){console.error("::error::GitHub answered \""+(j.message||"no default_branch").slice(0,200)+"\" for PhotonBounce/photonbounce. \"Not Found\" means the token cannot see that private repo: edit the token (github.com/settings/personal-access-tokens) so Repository access includes PhotonBounce/photonbounce and Actions is Read and write. \"Bad credentials\" means the secret holds a wrong or expired token.");process.exit(1)}console.log(j.default_branch)})')
          body=$(printf '{"ref":"%s","inputs":{"ref":"%s","dry_run":"%s"}}' "$branch" "$GITHUB_SHA" "$DRY")
          code=$(api -o /tmp/resp -w '%{http_code}' -X POST \
            https://api.github.com/repos/PhotonBounce/photonbounce/actions/workflows/deploy-zerofilter.yml/dispatches -d "$body")
          if [ "$code" != 204 ]; then
            echo "::error::Dispatch refused (HTTP $code): $(head -c 400 /tmp/resp)"
            exit 1
          fi
          echo "Deploy of $GITHUB_SHA requested on PhotonBounce/photonbounce ($branch)."
          echo "Its run (upload + live check) is listed under that repo's Actions -> 'Deploy ZeroFilter to photon-bounce.com'."
